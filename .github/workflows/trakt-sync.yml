name: Trakt to Letterboxd Sync

on:
  schedule:
    # Every Sunday at 00:00 UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      skip_upload:
        description: "Only export CSVs - do not upload to Letterboxd (for testing)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: trakt-to-letterboxd-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Export and upload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        # Only needed for the Letterboxd upload; skip when exporting CSVs only.
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.skip_upload == 'true') }}
        run: python -m playwright install --with-deps chromium

      - name: Install virtual display
        # Letterboxd's Cloudflare challenge rejects detectable headless
        # Chromium. Xvfb keeps the job unattended while allowing the browser
        # itself to run in headed mode, which is also the proven local path.
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.skip_upload == 'true') }}
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run Trakt export and Letterboxd upload
        id: sync
        env:
          TRAKT_USERNAME: ${{ secrets.TRAKT_USERNAME }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID || '0128c95089a7b58477204806a1b62ee130182b48c121c1eb9fe1d37b915fc5cb' }}
          LETTERBOXD_SESSION_COOKIE: ${{ secrets.LETTERBOXD_SESSION_COOKIE }}
          LETTERBOXD_CSRF_COOKIE: ${{ secrets.LETTERBOXD_CSRF_COOKIE }}
          LETTERBOXD_CF_CLEARANCE: ${{ secrets.LETTERBOXD_CF_CLEARANCE }}
        run: |
          set +e
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.skip_upload }}" == "true" ]]; then
            python Trakt2Letterboxd.py --skip-upload 2>&1 | tee sync.log
          else
            xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" \
              python Trakt2Letterboxd.py 2>&1 | tee sync.log
          fi
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Offer mobile cookie refresh
        if: ${{ failure() && steps.sync.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! grep -Eiq 'LETTERBOXD_SESSION_COOKIE.*(invalid|expired)|Letterboxd is asking for login' sync.log; then
            exit 0
          fi

          refresh_page="https://github.com/${REPO}/actions/workflows/refresh-letterboxd-cookies.yml"
          branch_file="https://github.com/${REPO}/blob/${GITHUB_SHA}/.github/workflows/refresh-letterboxd-cookies.yml"

          if [[ "${GITHUB_REF_NAME}" != "$DEFAULT_BRANCH" ]]; then
            {
              echo "## Letterboxd session expired"
              echo
              echo "The mobile refresh workflow is present on branch \\`${GITHUB_REF_NAME}\\`, but GitHub only exposes manually dispatchable workflow URLs from the default branch (\\`${DEFAULT_BRANCH}\\`)."
              echo
              echo "Merge this branch into the default branch first, then rerun the sync: [view the workflow file on this branch](${branch_file})."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## Letterboxd session expired"
            echo
            echo "A mobile cookie refresh has been started. Open the refresh run to get the temporary browser link:"
            echo
            echo "[Open Letterboxd cookie refresh workflow](${refresh_page})"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -n "$GH_TOKEN" ]]; then
            if gh workflow run refresh-letterboxd-cookies.yml --repo "$REPO"; then
              sleep 3
              refresh_run_id=$(gh run list \
                --workflow refresh-letterboxd-cookies.yml \
                --event workflow_dispatch \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId' 2>/dev/null || true)
              if [[ -n "$refresh_run_id" && "$refresh_run_id" != "null" ]]; then
                echo "[Open the active refresh run](https://github.com/${REPO}/actions/runs/${refresh_run_id})" >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo "The refresh workflow could not be auto-started; use the workflow link above." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "SECRETS_PAT is not configured, so the refresh workflow was not auto-started." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Letterboxd-ready CSVs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: letterboxd-ready-csvs
          path: exports/*.csv
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload debug screenshots (on failure)
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: letterboxd-upload-debug
          path: debug/
          retention-days: 7
          if-no-files-found: ignore
